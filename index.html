        <h1>Delphylax: a flood-rescue scout boat</h1>
        <p class="note">This page works best with JavaScript on. Here is everything important in plain text.</p>

        <h2>What it is</h2>
        <p>
          Delphylax is a small robot boat, about 94 cm long, that searches flooded streets. It helps people trapped in floods and the rescuers
          looking for them: rescuers can see where people are without wading into dangerous, muddy water.
        </p>

        <h2>The problem</h2>
        <p>
          In August 2022 Seoul had its heaviest daily rain since records began 115 years earlier. Three people died when water trapped a family
          inside their semi-basement home. In floods like this, muddy water hides what is underneath, and rescuers go in without being able to see.
        </p>

        <h2>How it works</h2>
        <ul>
          <li>Two sealed PVC-pipe hulls make a catamaran that is hard to flip; foam inside means a leak cannot sink it.</li>
          <li>Two brushless underwater thrusters push and steer it. A rescuer steers by remote control from the bank.</li>
          <li>Sonar finds objects under the water; the AMG8833 heat sensor spots people at the surface.</li>
          <li>A servo drops one glowing marker at a time where something is found, so rescuers know where to look.</li>
          <li>An ESP32 computer cuts the motors if the boat tips over or a leak is detected.</li>
        </ul>
        <p class="note">
          Delphylax has not had its first water test. Speed (about 1.2 m/s), weight and thrust are estimates, and the sonar and heat readouts
          shown on the site are simulated.
        </p>

        <h2>Cost</h2>
        <p>
          About $380 to build (535,510 won, a planning estimate). That is about 1/26 of the price of EMILY, a proven robotic lifeguard that sells
          for about $10,000. This compares price, not ability. <a href="./cost-notes.html">Cost notes</a>
        </p>
